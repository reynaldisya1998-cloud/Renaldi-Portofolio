 function draw(t){
  t/=1000;sx.fillStyle='#000';sx.fillRect(0,0,W,H);
  const m=Math.max(W,H);
  blob(W*(.78+.12*Math.sin(t*.13)),H*(.42+.2*Math.cos(t*.11)),m*.65,'rgba(255,255,255,1)');
  blob(W*(.25+.18*Math.cos(t*.09)),H*(.2+.12*Math.sin(t*.15)),m*.38,'rgba(200,200,200,.75)');
  blob(W*(.5+.25*Math.sin(t*.07+1)),H*(.85+.08*Math.cos(t*.12)),m*.42,'rgba(170,170,170,.6)');
  blob(W*(.6+.2*Math.cos(t*.1+2)),H*(.6+.15*Math.sin(t*.08)),m*.22,'rgba(248,68,46,.35)');

}

function videoPoster(file){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=URL.createObjectURL(file);v.src=u;
 v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||3)/3)};
 v.onseeked=()=>{const s=Math.min(1,1080/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res({blob:b,w:v.videoWidth,h:v.videoHeight}):rej(new Error('poster'))},'image/jpeg',.86)};
 v.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('video'))}})}
async function uploadImg(f){let w=0,h=0;try{const bm=await createImageBitmap(f);w=bm.width;h=bm.height}catch(e){}const up=await C.assets.upload(f,{type:f.type});return {a:up.id,t:'img',w,h}}
function upErr(f,e){return f.name+': '+(e&&e.code==='too_large'?'file lebih dari 20 MB, kompres dulu ya.':e&&e.code==='unsupported_type'?'format belum didukung (pakai JPG/PNG/WEBP/MP4).':e&&e.code==='quota_exceeded'?'penyimpanan penuh.':'gagal diupload, coba lagi.')}
async function addFiles(files){
 if(!C.assets){ED.msg='Upload hanya bisa dari akun pemilik.';ED.err=1;drawEditor();return}
 files=files.filter(f=>/^(image|video)\//.test(f.type));
 ED.busy+=files.length;ED.msg='';ED.err=0;drawEditor();
 for(const f of files){
  try{
   if(f.size>20*1024*1024) throw {code:'too_large'};
   if(f.type.startsWith('video/')){const p=await videoPoster(f);const up=await C.assets.upload(f,{type:f.type});const pp=await C.assets.upload(p.blob,{type:'image/jpeg'});ED.media.push({a:up.id,t:'video',p:pp.id,w:p.w,h:p.h})}
   else ED.media.push(await uploadImg(f));
  }catch(e){ED.err=1;ED.msg=upErr(f,e)}
  ED.busy--;drawEditor();
 }
}
function applyEditor(){
 if(!ED.title.trim()){ED.msg='Judul wajib diisi.';ED.err=1;drawEditor();return}

 const i=S.works.findIndex(x=>x.id===w.id);
 if(i>=0)S.works[i]=w;else S.works.unshift(w);
 dirty=true;closeOv('#edov');ED=null;render();toast('Diterapkan. Klik "Simpan & publish" untuk menayangkan.');
}

async function save(){
 if(!C.artifact){toast('Tidak bisa menyimpan dari tampilan ini');return}
 const o=document.createElement('div');o.className='ov';o.id='svov';o.innerHTML='<div class="modal" style="width:min(380px,100%);text-align:center"><h4>Menyimpan<span class="dot">…</span></h4><p class="msg">Mengirim perubahan ke GitHub…</p></div>';document.body.appendChild(o);
 try{await C.artifact.publish();closeOv('#svov');ORIG=JSON.stringify(S);dirty=false;render();toast('Tersimpan! Web publik ter-update ±1 menit lagi.')}
 catch(e){closeOv('#svov');const c=e&&e.code;
  if(c==='conflict')toast('Ada versi lebih baru, memuat ulang…');
  else if(c==='not_writer'||c==='not_granted'||c==='not_declared'){C.owner=false;dirty=false;render();toast('Tampilan ini read-only')}
  else if(c==='too_large')toast('Halaman terlalu besar untuk disimpan');
  else if(c==='rate_limited')toast('Terlalu sering, tunggu sebentar lalu coba lagi');
  else toast('Gagal menyimpan, coba lagi')}
}

/* PDF */
function pdfT(s){return String(s||'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'')}
async function toJpeg(id,max){const r=await fetch(U(id));if(!r.ok)throw new Error('img');const b=await r.blob();const bm=await createImageBitmap(b);const s=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);return {d:c.toDataURL('image/jpeg',.86),w:c.width,h:c.height}}
function openPdf(){
 const en=LANG==='en';
 const o=document.createElement('div');o.className='ov';o.id='pdov';document.body.appendChild(o);document.body.style.overflow='hidden';
 const cats=CATS.filter(c=>cnt(w=>w.cat===c.k));
 o.innerHTML=`<div class="modal"><h4>${en?'Download PDF':'Download PDF'}<span class="dot">.</span></h4><p class="msg">${en?'Choose what to include. A4 landscape, one work per page.':'Pilih isi portofolio. Format A4 landscape, satu karya per halaman.'}</p>
 <div class="fld"><label>${en?'Categories':'Kategori'}</label><div class="chk">${cats.map(c=>`<label><input type="checkbox" class="pc" value="${esc(c.k)}" checked>${esc(catName(c.k))} (${cnt(w=>w.cat===c.k)})</label>`).join('')}</div></div>
 <div class="msg" id="pd-m"></div><div class="mact"><button class="btn btn-o" data-a="pdx">${t('close')}</button><button class="btn btn-a" id="pd-go">${IC.dl} ${en?'Create PDF':'Buat PDF'}</button></div></div>`;
 $('#pd-go').onclick=async()=>{const sel=[...o.querySelectorAll('.pc:checked')].map(x=>x.value);
  const list=S.works.filter(w=>sel.includes(w.cat));
  const m=$('#pd-m');if(!list.length){m.textContent=en?'Nothing selected.':'Tidak ada karya yang dipilih.';return}
  const btn=$('#pd-go');btn.disabled=true;
  try{const blob=await makePdf(list,sel,x=>m.textContent=x);
   if(!C.downloads)C.downloads=await (window.claude&&claude.use?claude.use('downloads').catch(()=>null):null);
   if(!C.downloads){m.textContent=en?'Download is not available in this view.':'Download tidak tersedia di tampilan ini.';btn.disabled=false;return}
   m.textContent=en?'PDF ready. Confirm the download.':'PDF siap. Konfirmasi download di jendela yang muncul.';
   await C.downloads.save({filename:'Portfolio_'+S.profile.name.replace(/\s+/g,'_')+(en?'_EN':'')+'.pdf',data:blob});m.textContent=en?'Saved.':'Tersimpan.';
  }catch(e){m.className='msg err';m.textContent=e&&e.code==='declined'?(en?'Download cancelled.':'Download dibatalkan.'):(en?'Could not create PDF.':'Gagal membuat PDF.')}
  btn.disabled=false};
}
async function makePdf(list,cats,prog){
 const en=LANG==='en';
 if(!window.jspdf){await new Promise((r,j)=>{const s=document.createElement('script');s.src=JSPDF;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
 const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
 const W=297,H=210,P=S.profile,A=[248,68,46],G=[141,138,135];
 const bg=()=>{doc.setFillColor(0,0,0);doc.rect(0,0,W,H,'F')};
 const foot=(pg)=>{doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...G);doc.text(pdfT(P.name+'  |  WA '+P.waText+'  |  IG @'+P.ig+'  |  '+P.email),14,201);if(pg)doc.text(pg,W-14,201,{align:'right'})};
 const big=(x0,x,y,sz)=>{const s=pdfT(x0.toUpperCase());doc.setFont('helvetica','bold');doc.setFontSize(sz);doc.setTextColor(255,255,255);doc.text(s,x,y);doc.setTextColor(...A);doc.text('.',x+doc.getTextWidth(s),y)};
 bg();
 if(P.photo){try{const im=await toJpeg(P.photo,1000);let ih=150,iw=ih*im.w/im.h;if(iw>110){iw=110;ih=iw*im.h/im.w}doc.addImage(im.d,'JPEG',W-14-iw,26,iw,ih)}catch(e){}}
 doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...A);doc.text((en?'PORTFOLIO ':'PORTOFOLIO ')+new Date().getFullYear(),14,24);
 big(P.first,14,78,64);big(P.last,14,104,64);
 doc.setFont('helvetica','normal');doc.setFontSize(14);doc.setTextColor(255,255,255);doc.text(pdfT(L(P,'title').toUpperCase()),14,120);
 doc.setFontSize(10);doc.setTextColor(200,197,194);doc.text(doc.splitTextToSize(pdfT(L(P,'about')),140),14,134);
 doc.setTextColor(...G);['WhatsApp  '+P.waText,'Instagram  @'+P.ig,'Email  '+P.email].concat(P.site?['Web  '+P.site]:[]).forEach((l,i)=>doc.text(pdfT(l),14,170+i*6));
 let n=0;
 for(const c of CATS.filter(c=>cats.includes(c.k))){
  const ws=list.filter(w=>w.cat===c.k);if(!ws.length)continue;
  doc.addPage();bg();big(catName(c.k),14,120,58);doc.setFont('helvetica','normal');doc.setFontSize(12);doc.setTextColor(...G);doc.text(pdfT(ws.length+(en?' works  -  ':' karya  -  ')+(en?c.den:c.d)),14,134);foot();
  for(const w of ws){n++;prog((en?'Building page ':'Menyusun halaman ')+n+' / '+list.length+'…');
   doc.addPage();bg();
   doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...A);doc.text('RENALDI.',14,14);
   const M=w.media||[],X=14,Y=22,BW=176,BH=168;
   const ids=M.map(m=>m.t==='video'?(m.p||m.a):m.a).filter(Boolean);
   const fit=async(id,bx,by,bw,bh,mx)=>{try{const im=await toJpeg(id,mx);let iw=bw,ih=iw*im.h/im.w;if(ih>bh){ih=bh;iw=ih*im.w/im.h}doc.addImage(im.d,'JPEG',bx+(bw-iw)/2,by+(bh-ih)/2,iw,ih)}catch(e){}};
   const wide=M.length>1&&M.length<=3&&M.every(m=>m.w&&m.h&&m.w/m.h>1.2);
   if(wide){const k=M.length,ch=(BH-(k-1)*5)/k;for(let j=0;j<k;j++)await fit(ids[j],X,Y+j*(ch+5),BW,ch,1600)}
   else if(ids.length<=3){const k=Math.max(ids.length,1),cw=(BW-(k-1)*5)/k;for(let j=0;j<ids.length;j++)await fit(ids[j],X+j*(cw+5),Y,cw,BH,k>1?1200:1800)}
   else{const main=BH-50;await fit(ids[0],X,Y,BW,main,1800);const k=Math.min(ids.length-1,5),tw=(BW-(k-1)*4)/k;for(let j=1;j<=k;j++)await fit(ids[j],X+(j-1)*(tw+4),Y+main+4,tw,46,800)}
   const RX=200,RW=83;
   doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...A);doc.text(pdfT([catName(w.cat),w.sub?subName(w.cat,w.sub):''].filter(Boolean).join(' / ').toUpperCase()),RX,30);
   doc.setFontSize(22);doc.setTextColor(255,255,255);const tl=doc.splitTextToSize(pdfT(L(w,'title').toUpperCase()),RW);doc.text(tl,RX,42,{lineHeightFactor:1.05});
   let y=42+tl.length*8.4+4;
   doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...G);doc.text(pdfT([w.brand&&w.brand!=='Personal'?w.brand:'',w.year].filter(Boolean).join('  -  ')),RX,y);y+=10;
   const ds=L(w,'desc');if(ds){doc.setFontSize(10.5);doc.setTextColor(215,212,209);const dl=doc.splitTextToSize(pdfT(ds),RW);doc.text(dl,RX,y,{lineHeightFactor:1.45});y+=dl.length*5.4+6}
   if(w.link){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...A);doc.textWithLink(pdfT(t('watchOn')+' '+linkHost(w.link)+' >'),RX,y+6,{url:w.link});y+=14}
   if(M.some(m=>m.t==='video')){doc.setFillColor(...A);doc.roundedRect(RX,y,RW,12,6,6,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text(en?'Watch the video on the web portfolio':'Tonton videonya di web portofolio',RX+RW/2,y+7.6,{align:'center'});if(P.site)doc.link(RX,y,RW,12,{url:P.site})}
   foot(String(n).padStart(2,'0')+' / '+String(list.length).padStart(2,'0'));
  }
 }
 prog(en?'Saving PDF…':'Menyimpan PDF…');
 return doc.output('blob');
}

/* events */
document.addEventListener('click',e=>{
 const tg=e.target.closest('[data-a]');if(!tg)return;const a=tg.dataset.a,v=tg.dataset.v,id=tg.dataset.id;
 if(['edit','del','up','down','tphoto'].includes(a))e.stopPropagation();
 switch(a){
  case 'snd':{const v=document.querySelector('.reel video');if(v){v.muted=!v.muted;if(!v.muted){v.currentTime=0}v.play().catch(()=>{});tg.innerHTML=v.muted?IC.snd0:IC.snd1}break}
  case 'lang':LANG=v;try{localStorage.setItem('lang',v)}catch(_){};document.documentElement.lang=v;render();break;
  case 'cat':setCat(v);break;
  case 'sub':F.sub=v;renderWorks();break;
  case 'open':openLB(id);break;
  case 'lbx':closeOv('#lbov');LB=null;break;
  case 'lbp':LB.i=(LB.i-1+LB.w.media.length)%LB.w.media.length;drawLB();break;
  case 'lbn':LB.i=(LB.i+1)%LB.w.media.length;drawLB();break;
  case 'lbi':LB.i=+v;drawLB();break;
  case 'copy':{const em=S.profile.email;try{navigator.clipboard.writeText(em).then(()=>toast(t('copied')),()=>{selEm();toast(t('pressCopy'))})}catch(_){selEm()}break}
  case 'pdf':openPdf();break;
  case 'pdx':closeOv('#pdov');break;
  case 'add':openEditor(null);break;
  case 'edit':openEditor(id);break;
  case 'edx':closeOv('#edov');ED=null;break;
  case 'edok':applyEditor();break;
  case 'mcov':{const [m]=ED.media.splice(+v,1);ED.media.unshift(m);drawEditor();break}
  case 'mrm':ED.media.splice(+v,1);drawEditor();break;
  case 'del':{const w=S.works.find(x=>x.id===id);confirmBox('Hapus "'+w.title+'" dari portofolio?','Hapus',()=>{S.works=S.works.filter(x=>x.id!==id);dirty=true;render()});break}
  case 'cfx':closeOv('#cfov');break;
  case 'up':case 'down':{const i=S.works.findIndex(x=>x.id===id),j=a==='up'?i-1:i+1;if(j<0||j>=S.works.length)break;[S.works[i],S.works[j]]=[S.works[j],S.works[i]];dirty=true;render();break}
  case 'profile':openProfile();break;
  case 'pfx':closeOv('#pfov');break;
  case 'logos':openLogos();break;
  case 'lgadd':LG.list.push({name:'Brand baru',a:null});drawLogos();break;
  case 'lgrm':LG.list.splice(+v,1);drawLogos();break;
  case 'lgup':{const i=+v;[LG.list[i-1],LG.list[i]]=[LG.list[i],LG.list[i-1]];drawLogos();break}
  case 'lgx':closeOv('#lgov');LG=null;break;
  case 'lgok':S.logos=LG.list.filter(b=>b.name.trim()||b.a);dirty=true;closeOv('#lgov');LG=null;render();break;
  case 'photo':pickPhoto();break;
  case 'tphoto':pickPhoto(+v);break;
  case 'topen':{const x=S.travel[+v];LB={w:{title:L(x,'country'),cat:'__travel',city:x.city,year:x.year,media:(x.photos||[]).map(a=>({a,t:'img'}))},i:0};drawLB();break}
  case 'save':save();break;
  case 'ghout':try{localStorage.removeItem('gh_cfg')}catch(e){}location.href=GH.base;break;
  case 'discard':S=JSON.parse(ORIG);dirty=false;render();break;
 }
});
function selEm(){const r=document.createRange();r.selectNodeContents($('#em'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('keydown',e=>{if(!LB||!$('#lbov'))return;const n=LB.w.media.length;if(e.key==='Escape'){closeOv('#lbov');LB=null}else if(e.key==='ArrowRight'&&n>1){LB.i=(LB.i+1)%n;drawLB()}else if(e.key==='ArrowLeft'&&n>1){LB.i=(LB.i-1+n)%n;drawLB()}});
document.addEventListener('click',e=>{if(e.target.id==='lbov'){closeOv('#lbov');LB=null}});

render();
GHstart();
})();

</script>
